[project]
name = "efficient-text-to-sql"
version = "0.1.0"
description = "DuckDB Analytics Agent – multi-agent NL-to-SQL with LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.10,<2",
    "langgraph-sdk>=0.3.5",
    "langgraph-checkpoint>=3.0.1,<5",
    "langchain-core>=0.3.66",
    "langchain-openai>=0.3.0",
    "duckdb>=1.2.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[tool.uv]
dev-dependencies = [
    "langgraph-cli[inmem]>=0.2.10",
    "pytest>=8.0.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
